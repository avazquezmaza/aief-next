<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 730" width="1300" height="730" role="img" aria-labelledby="cr-title cr-desc" style="background-color:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="cr-title">AIEF core runtime architecture</title>
  <desc id="cr-desc">Five layers, top to bottom: CLI Commands (doctor, bootstrap, prompt, verify, status, close) call Application Services (discovery, Change lifecycle, prompt composition, verification, workflow, graph and next), which use Domain Models (Change, Manifest, Requirement, Skill, Hook, Graph) and Registries and Providers (workflow tracks, skills, standards, hooks, verification rules, requirement providers, SDD providers), all of which ultimately read and write Repository Files (AGENTS.md, changes/, knowledge/, ai-specs/, evidence).</desc>
