  <text x="40" y="696" font-size="12" fill="#64748b">Each layer owns one responsibility — CLI parses and renders, Services orchestrate, Domain Models hold shape and validation.</text>
  <text x="40" y="714" font-size="12" fill="#64748b">Registries map an id to an implementation, and every read/write ends at the Repository. See the Implementation Map table for exact file paths.</text>
