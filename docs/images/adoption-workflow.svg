<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 620" width="1300" height="620" role="img" aria-labelledby="aw-title aw-desc" style="background-color:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="aw-title">AIEF adoption workflow for an existing repository</title>
  <desc id="aw-desc">An existing repository flows through doctor (inspect only, no writes), bootstrap (adds visible governance structure such as AGENTS.md, changes/, and knowledge/, never touching application code, never overwriting existing files), verify (validates the resulting structure), and analyze (records an Analysis Change capturing the existing project's architecture, stack and risks), before the first delivery Change begins. Application code, tests, CI configuration, Git history and existing tools like OpenSpec or SpecBoot are preserved throughout; AGENTS.md, changes/, knowledge/, and the Adoption and Analysis Changes are added or reused. Two Changes are typically open after adoption: the Adoption Change and the Analysis Change.</desc>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1300" height="620" fill="#ffffff"/>
  <text x="40" y="38" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="-0.3px">AIEF — Adopting AIEF into an existing repository</text>
  <text x="40" y="58" font-size="12" fill="#64748b">doctor inspects, bootstrap adds visible structure, verify validates, analyze records understanding</text>
  <g transform="translate(75.0,84)">
    <rect width="180" height="92" rx="10" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="90.0" y="42.0" font-size="13" font-weight="800" fill="#334155" text-anchor="middle">Existing</text>
    <text x="90.0" y="60.0" font-size="11.5" font-weight="600" fill="#334155" text-anchor="middle">repository</text>
  </g>
  <g transform="translate(269.0,84)">
    <rect width="180" height="92" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="90.0" y="42.0" font-size="13" font-weight="800" fill="#0f172a" text-anchor="middle">doctor</text>
    <text x="90.0" y="60.0" font-size="11.5" font-weight="600" fill="#0f172a" text-anchor="middle">inspect only</text>
  </g>
  <g transform="translate(463.0,84)">
    <rect width="180" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="90.0" y="33.0" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">bootstrap</text>
    <text x="90.0" y="51.0" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">add visible</text>
    <text x="90.0" y="69.0" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">governance structure</text>
  </g>
  <g transform="translate(657.0,84)">
    <rect width="180" height="92" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="90.0" y="42.0" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">verify</text>
    <text x="90.0" y="60.0" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">validate adoption</text>
  </g>
  <g transform="translate(851.0,84)">
    <rect width="180" height="92" rx="10" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="90.0" y="33.0" font-size="13" font-weight="800" fill="#1e40af" text-anchor="middle">analyze</text>
    <text x="90.0" y="51.0" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">record existing-project</text>
    <text x="90.0" y="69.0" font-size="11.5" font-weight="600" fill="#1e40af" text-anchor="middle">understanding</text>
  </g>
  <g transform="translate(1045.0,84)">
    <rect width="180" height="92" rx="10" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <text x="90.0" y="42.0" font-size="13" font-weight="800" fill="#166534" text-anchor="middle">first delivery</text>
    <text x="90.0" y="60.0" font-size="11.5" font-weight="600" fill="#166534" text-anchor="middle">Change</text>
  </g>
  <path d="M 255.0 130.0 L 269.0 130.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <path d="M 449.0 130.0 L 463.0 130.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <path d="M 643.0 130.0 L 657.0 130.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <path d="M 837.0 130.0 L 851.0 130.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <path d="M 1031.0 130.0 L 1045.0 130.0" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <g transform="translate(40,236)">
    <rect width="594.0" height="190" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#166534" letter-spacing="0.3px">Preserved (never modified by bootstrap)</text>
  </g>
  <text x="56" y="282" font-size="12" fill="#166534">- application code</text>
  <text x="56" y="303" font-size="12" fill="#166534">- tests</text>
  <text x="56" y="324" font-size="12" fill="#166534">- CI configuration</text>
  <text x="56" y="345" font-size="12" fill="#166534">- Git history</text>
  <text x="56" y="366" font-size="12" fill="#166534">- existing tools (OpenSpec, SpecBoot, ...)</text>
  <g transform="translate(666.0,236)">
    <rect width="594.0" height="190" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#1e40af" letter-spacing="0.3px">Added or reused (created only when missing)</text>
  </g>
  <text x="682.0" y="282" font-size="12" fill="#1e40af">- AGENTS.md</text>
  <text x="682.0" y="303" font-size="12" fill="#1e40af">- changes/</text>
  <text x="682.0" y="324" font-size="12" fill="#1e40af">- knowledge/ (standards, skills.md)</text>
  <text x="682.0" y="345" font-size="12" fill="#1e40af">- adoption records (Adoption Change)</text>
  <text x="682.0" y="366" font-size="12" fill="#1e40af">- Analysis Change (from analyze)</text>
  <path d="M 553.0 176 L 485.5 236" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-green)"/>
  <path d="M 553.0 176 L 814.5 236" fill="none" stroke="#2563eb" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-blue)"/>
  <text x="40" y="460" font-size="12" fill="#64748b">- doctor never writes to the project — every write happens in bootstrap, analyze, or a later delivery Change.</text>
  <text x="40" y="480" font-size="12" fill="#64748b">- bootstrap never overwrites an existing file (AGENTS.md, knowledge/standards/, CI gate) and is idempotent.</text>
  <text x="40" y="500" font-size="12" fill="#64748b">- After adoption there are typically two open Changes: the Adoption Change and the Analysis Change.</text>
  <text x="40" y="520" font-size="12" fill="#64748b">- The Adoption Change records that AIEF was added; the Analysis Change captures architecture, stack, risks and gaps.</text>
  <text x="40" y="540" font-size="12" fill="#64748b">- Delivery Changes (new-change / enrich) come after — they are the first real feature, fix or refactor.</text>
</svg>
