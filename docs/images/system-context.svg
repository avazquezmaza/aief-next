<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 600" width="1300" height="600" role="img" aria-labelledby="sc-title sc-desc" style="background-color:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="sc-title">AIEF system context</title>
  <desc id="sc-desc">Four zones: external inputs (humans, requirement sources, optional specification providers) feed AIEF Core (bootstrap, Change management, prompt composition, verification, Graph and next recommendation), which reads and writes only the visible repository state (AGENTS.md, changes/, knowledge/, ai-specs/, evidence) and generates a prompt for the execution environment (AI assistants, project tools, tests, CI, Git and release tools) without ever executing it itself. Assistants and project tools write evidence back into the repository. Humans retain scope, merge, release, and publication authority throughout.</desc>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1300" height="600" fill="#ffffff"/>
  <text x="40" y="38" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="-0.3px">AIEF — System Context</text>
  <text x="40" y="58" font-size="12" fill="#64748b">Where AIEF sits among humans, tools, and the repository</text>
  <g transform="translate(40,76)">
    <rect width="330" height="300" rx="12" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#334155" letter-spacing="0.3px">External inputs</text>
  </g>
  <text x="56" y="118" font-size="11" fill="#64748b">Outside AIEF's control</text>
  <g transform="translate(56,132)">
    <rect width="298" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#334155">Humans</text>
  </g>
  <g transform="translate(56,174)">
    <rect width="298" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#334155">Requirement sources</text>
  </g>
  <g transform="translate(56,216)">
    <rect width="298" height="34" rx="8" fill="#f1f5f9" stroke="#cbd5e1" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#334155">Optional specification providers</text>
  </g>
  <g transform="translate(485,76)">
    <rect width="330" height="300" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#1e40af" letter-spacing="0.3px">AIEF Core</text>
  </g>
  <text x="501" y="118" font-size="11" fill="#64748b">Reads and writes only the repository below</text>
  <g transform="translate(501,132)">
    <rect width="298" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#1e40af">Bootstrap and discovery</text>
  </g>
  <g transform="translate(501,174)">
    <rect width="298" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#1e40af">Change management</text>
  </g>
  <g transform="translate(501,216)">
    <rect width="298" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#1e40af">Prompt composition</text>
  </g>
  <g transform="translate(501,258)">
    <rect width="298" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#1e40af">Verification</text>
  </g>
  <g transform="translate(501,300)">
    <rect width="298" height="34" rx="8" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#1e40af">Graph and next recommendation</text>
  </g>
  <g transform="translate(930,76)">
    <rect width="330" height="300" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#6b21a8" letter-spacing="0.3px">Execution environment</text>
  </g>
  <text x="946" y="118" font-size="11" fill="#64748b">Outside AIEF — humans control it</text>
  <g transform="translate(946,132)">
    <rect width="298" height="34" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#6b21a8">AI assistants</text>
  </g>
  <g transform="translate(946,174)">
    <rect width="298" height="34" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#6b21a8">Project tools</text>
  </g>
  <g transform="translate(946,216)">
    <rect width="298" height="34" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#6b21a8">Tests and CI</text>
  </g>
  <g transform="translate(946,258)">
    <rect width="298" height="34" rx="8" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#6b21a8">Git and release tools</text>
  </g>
  <path d="M 370 206 L 485 206" fill="none" stroke="#334155" stroke-width="2" marker-end="url(#arrow-slate)"/>
  <text x="427.5" y="186" font-size="10" fill="#64748b" text-anchor="middle">requirements,</text>
  <text x="427.5" y="198" font-size="10" fill="#64748b" text-anchor="middle">decisions</text>
  <path d="M 815 206 L 930 206" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="872.5" y="186" font-size="10" fill="#1d4ed8" text-anchor="middle">generates</text>
  <text x="872.5" y="198" font-size="10" fill="#1d4ed8" text-anchor="middle">prompt for</text>
  <text x="872.5" y="228" font-size="10" fill="#991b1b" text-anchor="middle">never</text>
  <text x="872.5" y="240" font-size="10" fill="#991b1b" text-anchor="middle">executes</text>
  <g transform="translate(40,436)">
    <rect width="1220" height="130" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#166534" letter-spacing="0.3px">Visible repository state — the only place AIEF reads or writes</text>
  </g>
  <g transform="translate(60,484)">
    <rect width="120" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#166534">AGENTS.md</text>
  </g>
  <g transform="translate(194,484)">
    <rect width="120" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#166534">changes/</text>
  </g>
  <g transform="translate(328,484)">
    <rect width="122" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#166534">knowledge/</text>
  </g>
  <g transform="translate(464,484)">
    <rect width="120" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#166534">ai-specs/</text>
  </g>
  <g transform="translate(598,484)">
    <rect width="120" height="34" rx="8" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1"/>
    <text x="12" y="21" font-size="12" font-weight="600" fill="#166534">evidence</text>
  </g>
  <path d="M 636.0 376 L 636.0 436" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 664.0 436 L 664.0 376" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="650.0" y="410" font-size="10.5" fill="#1d4ed8" text-anchor="middle">reads / writes</text>
  <path d="M 1095.0 376 L 1095.0 436" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <text x="1095.0" y="410" font-size="10.5" fill="#6b21a8" text-anchor="middle">assistants + tools/CI write evidence</text>
  <text x="40" y="596" font-size="12" fill="#64748b">Humans retain scope, merge, release, and publication authority throughout the Execution environment. AIEF keeps no hidden state — nothing exists outside the files shown above.</text>
</svg>
