<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 784" width="1300" height="784" role="img" aria-labelledby="wl-title wl-desc" style="background-color:#ffffff;font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
  <title id="wl-title">AIEF Change lifecycle</title>
  <desc id="wl-desc">Three levels: Level 1, Context and Change preparation (doctor, bootstrap, analyze/new-change/enrich, prompt); Level 2, Assistant implementation (any AI assistant, optionally structured by OpenSpec, writes evidence.md); Level 3, Verification and closing (verify, close --yes, status --graph/--next). A failed verify is fixed and re-prompted manually, never automatically. status --next only recommends the following Change. Harness, Hooks, and Loop are opt-in observation and feedback capabilities that append notes and track retry counts — none of them executes a command or blocks verify or close.</desc>
  <defs>
    <filter id="card-shadow" x="-8%" y="-8%" width="116%" height="116%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow-slate" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#334155"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#2563eb"/>
    </marker>
    <marker id="arrow-violet" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#7c3aed"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1300" height="784" fill="#ffffff"/>
  <text x="40" y="38" font-size="19" font-weight="800" fill="#0f172a" letter-spacing="-0.3px">AIEF — Workflow Lifecycle</text>
  <text x="40" y="58" font-size="12" fill="#64748b">The detailed path of a single Change, level by level</text>
  <g transform="translate(40,140)">
    <rect width="380" height="448" rx="12" fill="#eff6ff" stroke="#bfdbfe" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#1e40af" letter-spacing="0.3px">Level 1 — Context &amp; Change preparation</text>
  </g>
  <g transform="translate(56,184)">
    <rect width="348" height="86" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 338 0 A 10 10 0 0 1 348 10 L 348 32 L 0 32 Z" fill="#0f172a"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">aief doctor</text>
    <text x="14" y="54" font-size="12" fill="#1d4ed8">Environment + project readiness check.</text>
  </g>
  <g transform="translate(56,286)">
    <rect width="348" height="86" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 338 0 A 10 10 0 0 1 348 10 L 348 32 L 0 32 Z" fill="#0f172a"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">aief bootstrap</text>
    <text x="14" y="54" font-size="12" fill="#1d4ed8">Adopts a project — creates AGENTS.md,</text>
    <text x="14" y="73" font-size="12" fill="#1d4ed8">changes/, knowledge/. Never overwrites.</text>
  </g>
  <g transform="translate(56,388)">
    <rect width="348" height="86" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 338 0 A 10 10 0 0 1 348 10 L 348 32 L 0 32 Z" fill="#0f172a"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">analyze / new-change / enrich</text>
    <text x="14" y="54" font-size="12" fill="#1d4ed8">Creates the Change: change.md,</text>
    <text x="14" y="73" font-size="12" fill="#1d4ed8">spec.md, tasks.md.</text>
  </g>
  <g transform="translate(56,490)">
    <rect width="348" height="86" rx="10" fill="#ffffff" stroke="#bfdbfe" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 338 0 A 10 10 0 0 1 348 10 L 348 32 L 0 32 Z" fill="#0f172a"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">aief prompt</text>
    <text x="14" y="54" font-size="12" fill="#1d4ed8">Composes the context-complete prompt.</text>
    <text x="14" y="73" font-size="12" fill="#1d4ed8">AIEF does not call the assistant.</text>
  </g>
  <g transform="translate(460,140)">
    <rect width="380" height="244" rx="12" fill="#faf5ff" stroke="#e9d5ff" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#6b21a8" letter-spacing="0.3px">Level 2 — Assistant implementation</text>
  </g>
  <g transform="translate(476,184)">
    <rect width="348" height="86" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 338 0 A 10 10 0 0 1 348 10 L 348 32 L 0 32 Z" fill="#0f172a"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">AI assistant (any)</text>
    <text x="14" y="54" font-size="12" fill="#7c3aed">Implements from the pasted prompt.</text>
    <text x="14" y="73" font-size="12" fill="#7c3aed">OpenSpec is an optional structuring path.</text>
  </g>
  <g transform="translate(476,286)">
    <rect width="348" height="86" rx="10" fill="#ffffff" stroke="#e9d5ff" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 338 0 A 10 10 0 0 1 348 10 L 348 32 L 0 32 Z" fill="#0f172a"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">Write evidence.md</text>
    <text x="14" y="54" font-size="12" fill="#7c3aed">Records what was actually done and</text>
    <text x="14" y="73" font-size="12" fill="#7c3aed">verified — not a template.</text>
  </g>
  <g transform="translate(880,140)">
    <rect width="380" height="346" rx="12" fill="#f0fdf4" stroke="#bbf7d0" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#166534" letter-spacing="0.3px">Level 3 — Verification &amp; closing</text>
  </g>
  <g transform="translate(896,184)">
    <rect width="348" height="86" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 338 0 A 10 10 0 0 1 348 10 L 348 32 L 0 32 Z" fill="#0f172a"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">aief verify</text>
    <text x="14" y="54" font-size="12" fill="#15803d">Structural check, optional requirement</text>
    <text x="14" y="73" font-size="12" fill="#15803d">check. Never AI-judged.</text>
  </g>
  <g transform="translate(896,286)">
    <rect width="348" height="86" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 338 0 A 10 10 0 0 1 348 10 L 348 32 L 0 32 Z" fill="#0f172a"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">aief close --yes</text>
    <text x="14" y="54" font-size="12" fill="#15803d">Marks the Change Closed once ready.</text>
  </g>
  <g transform="translate(896,388)">
    <rect width="348" height="86" rx="10" fill="#ffffff" stroke="#bbf7d0" stroke-width="1.5" filter="url(#card-shadow)"/>
    <path d="M 0 10 A 10 10 0 0 1 10 0 L 338 0 A 10 10 0 0 1 348 10 L 348 32 L 0 32 Z" fill="#0f172a"/>
    <text x="14" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#ffffff">status --graph / --next</text>
    <text x="14" y="54" font-size="12" fill="#15803d">Read-only graph view; recommends one</text>
    <text x="14" y="73" font-size="12" fill="#15803d">Change — never executes it.</text>
  </g>
  <path d="M 230.0 270 L 230.0 286" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 230.0 372 L 230.0 388" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 230.0 474 L 230.0 490" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <path d="M 650.0 270 L 650.0 286" fill="none" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-violet)"/>
  <path d="M 1070.0 270 L 1070.0 286" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 1070.0 372 L 1070.0 388" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <path d="M 404 533.0 C 440.0 533.0, 440.0 227.0, 476 227.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <path d="M 824 329.0 C 860.0 329.0, 860.0 227.0, 896 227.0" fill="none" stroke="#334155" stroke-width="2.5" marker-end="url(#arrow-slate)"/>
  <path d="M 1070.0 184 L 1070.0 106 L 16 106 L 16 533.0 L 56 533.0" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-red)"/>
  <g transform="translate(130.0,80)">
    <rect width="280" height="20" rx="10" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
    <text x="140.0" y="14" font-size="10.5" font-weight="700" fill="#991b1b" text-anchor="middle">fail -&gt; human fixes, re-prompts</text>
  </g>
  <path d="M 1244 441.0 C 1244 618, 404 618, 404 441.0" fill="none" stroke="#d97706" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrow-amber)"/>
  <g transform="translate(100,606)">
    <rect width="240" height="20" rx="10" fill="#fffbeb" stroke="#fde68a" stroke-width="1"/>
    <text x="120.0" y="14" font-size="10.5" font-weight="700" fill="#92400e" text-anchor="middle">recommends next (not automatic)</text>
  </g>
  <g transform="translate(40,658)">
    <rect width="1220" height="96" rx="12" fill="#fffbeb" stroke="#fde68a" stroke-width="1.5" stroke-dasharray="0"/>
    <text x="16" y="24" font-size="12.5" font-weight="800" fill="#92400e" letter-spacing="0.3px">Harness / Hooks / Loop — observation &amp; feedback, never executors or gates</text>
  </g>
  <g transform="translate(60,698)">
    <text x="0" y="18" font-size="12" font-weight="700" fill="#92400e">Harness / Hooks</text>
    <text x="0" y="36" font-size="11" fill="#92400e">Append visible, non-blocking notes to prompt/verify output.</text>
  </g>
  <g transform="translate(660,698)">
    <text x="0" y="18" font-size="12" font-weight="700" fill="#92400e">Loop</text>
    <text x="0" y="36" font-size="11" fill="#92400e">Tracks verify attempts in loop.md; retry is always a manual re-run.</text>
  </g>
</svg>
