name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, independent of any push — catches a newly disclosed CVE in
    # already-merged code, not only new changes.
    - cron: "0 6 * * 1"

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
      - uses: github/codeql-action/analyze@v3
